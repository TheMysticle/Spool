<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Watch — Spool</title>
  <script src="/config.js"></script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
</head>
<body>
  <div class="app-shell">

    <header class="header">
      <div class="header-left">
        <button class="icon-btn" id="sidebar-toggle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <a href="/" class="header-logo"><div class="logo-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg></div><span class="logo-text">Spool</span></a>
      </div>

      <div class="header-center">
        <div class="search-bar-wrapper">
          <input type="text" id="search-input" placeholder="Search" autocomplete="off" />
          <button class="search-clear-btn" id="search-clear-btn" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
          <button class="search-btn" aria-label="Search" onclick="document.getElementById('search-input').focus()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
        </div>
      </div>

      <div class="header-right">
        <!-- Upload Button -->
        <button class="icon-btn" id="upload-trigger" title="Upload Video" type="button" style="display:none;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <!-- Notification Bell -->
        <div class="notif-container">
          <button class="icon-btn" id="notif-trigger" title="Notifications" type="button">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="notif-badge" id="notif-badge" style="display:none"></span>
          </button>
          <div class="notif-dropdown" id="notif-dropdown">
            <div class="notif-header">Notifications</div>
            <div class="notif-list" id="notif-list">
              <div class="notif-empty">No new activity</div>
            </div>
          </div>
        </div>

        <div class="user-menu-container">
          <div class="avatar" id="user-menu-trigger">U</div>
          <div class="user-dropdown" id="user-dropdown">
            <div class="dropdown-user-info">
              <p class="dropdown-name" id="dropdown-user-name">User</p>
              <p class="dropdown-role" id="dropdown-user-role">Viewer</p>
            </div>
            <div class="dropdown-divider"></div>
            <a href="/admin.html" class="dropdown-item" id="admin-link" style="display:none">Admin</a>
            <button class="dropdown-item" id="logout-btn">Sign Out</button>
          </div>
        </div>
      </div>
    </header>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="main-layout" id="main-layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
          <button class="nav-item tab-btn active" data-category="all">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
          </button>
          <button class="nav-item tab-btn" data-category="video">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="15" height="10" rx="2"/><polygon points="17 9 22 7 22 17 17 15"/></svg>
            <span>Videos</span>
          </button>
          <button class="nav-item" id="channels-btn" type="button" style="display:none;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
            <span data-collapsed-label="Channels">Channels</span>
          </button>
          <button class="nav-item tab-btn" data-category="livestream">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"/><path d="M16.5 7.5a6 6 0 0 1 0 9M7.5 7.5a6 6 0 0 0 0 9M19.4 5.6a10 10 0 0 1 0 12.8M4.6 5.6a10 10 0 0 0 0 12.8"/></svg>
            <span data-collapsed-label="Live">Live Streams</span>
          </button>
          <button class="nav-item" id="people-btn" type="button">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="8" r="4"/><path d="M2 20a8 8 0 0 1 16 0"/></svg>
            <span data-collapsed-label="People">People</span>
          </button>
          <button class="nav-item" id="series-btn" type="button">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>
            <span data-collapsed-label="Series">Series</span>
          </button>
        </div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-section">
          <h3 class="sidebar-title">You</h3>
          <button class="nav-item" id="history-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            <span>History</span>
          </button>
          <button class="nav-item" id="favorites-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.35-9.5-8.14C.98 10.5 1.4 7.2 3.9 5.6c2.01-1.29 4.62-.9 6.1.9L12 8.4l2-1.9c1.48-1.8 4.09-2.19 6.1-.9 2.5 1.6 2.92 4.9 1.4 7.26C19 16.65 12 21 12 21z"/></svg>
            <span>Favorites</span>
          </button>
        </div>
      </aside>

      <main class="main-content" style="padding-top: 16px;">
        <div class="watch-layout" id="watch-layout">

          <!-- Left Column: Video, Info, Comments -->
          <div class="watch-main-col">
            <div class="player-container" id="player-container" style="position: relative;">
              <video id="video-player" class="video-js vjs-big-play-centered" controls preload="metadata" playsinline></video>

              <div id="video-ui-overlay" class="video-ui-overlay">
                <div class="video-overlay-header">
                  <h2 id="overlay-video-title" class="overlay-title"></h2>
                  <div class="overlay-header-actions"></div>
                </div>

                <div class="skip-zone left" id="skip-left">
                  <div class="dt-ripple" id="ripple-left"><span>5s</span></div>
                </div>
                <div class="skip-zone right" id="skip-right">
                  <div class="dt-ripple" id="ripple-right"><span>5s</span></div>
                </div>

                <div class="central-controls">
                  <button class="ui-btn" id="ui-prev" title="Previous" type="button">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                  </button>

                  <button class="ui-btn main-play" id="ui-play-pause" title="Play/Pause" type="button">
                    <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                  </button>

                  <button class="ui-btn" id="ui-next" title="Next" type="button">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                  </button>
                </div>
              </div>
            </div>
            
            <div id="transcoding-bar" style="display:none">Transcoding...</div>
            
            <div class="video-info" id="video-info"></div>

            <section class="comments-panel" id="comments-panel">
              <h3 style="margin-bottom:16px;">Comments <span id="comments-count" style="color:var(--text-secondary);font-size:0.9rem;"></span></h3>
              <form id="comment-form" class="comment-form">
                <div class="avatar" id="current-user-avatar">?</div>
                <div class="comment-form-group">
                  <textarea id="comment-input" rows="1" placeholder="Add a comment..."></textarea>
                  <div class="comment-actions" id="comment-form-actions" style="text-align:right; margin-top:8px; display:none;">
                    <span id="comment-error" style="color:var(--danger); font-size: 0.8rem; margin-right: 12px;"></span>
                    <button type="button" class="btn btn-ghost btn-sm" id="comment-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm" id="comment-submit" disabled>Comment</button>
                  </div>
                </div>
              </form>
              <div id="comments-list" class="comments-list" style="margin-top:24px;"></div>
            </section>
          </div>

          <!-- Right Column: Up Next / Debug -->
          <aside class="watch-sidebar-col">
            <div id="up-next-aside">
              <!-- Autoplay Header Switch -->
              <div class="autoplay-header">
                <h3>Up Next</h3>
                <div style="display: flex; align-items: center; gap: 8px;">
                  <span style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 500;">Autoplay</span>
                  <label class="switch">
                    <input type="checkbox" id="autoplay-toggle" checked>
                    <span class="slider"></span>
                  </label>
                </div>
              </div>
              <div class="up-next-panel" id="up-next"></div>
            </div>

            <div id="debug-panel" class="debug-panel">
              <div class="debug-panel-header">
                <h3>Debug Console</h3>
              </div>
              <div class="debug-scroll-area">
                <div class="debug-section">
                  <label>Metadata</label>
                  <div id="debug-meta" class="code-block"></div>
                </div>
                <div class="debug-section">
                  <label>Console Log</label>
                  <div id="debug-log" class="code-block"></div>
                </div>
              </div>
              <div class="debug-actions">
                <button class="btn btn-ghost btn-sm" id="debug-probe-btn">Probe</button>
                <button class="btn btn-ghost btn-sm" id="debug-copy-btn">Copy</button>
                <button class="btn btn-ghost btn-sm" id="debug-clear-btn">Clear</button>
              </div>
            </div>
          </aside>

        </div>
      </main>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/upload.js"></script>
  <script src="/js/watch.js"></script>
</body>
</html>
