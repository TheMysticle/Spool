<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Spool</title>
  <script src="/config.js"></script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body class="login-body">
  <div class="login-glow"></div>

  <div class="login-page">
    <div class="login-box" id="login-box">
      <div class="login-header">
        <div class="login-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
        </div>
        <h1>Welcome Back</h1>
        <p class="login-subtitle">Sign in to your private archive</p>
      </div>

      <form id="login-form" autocomplete="on" novalidate>
        <div id="credentials-section">
          <div class="form-group" id="username-group">
            <label class="form-label" for="username">Username</label>
            <input class="form-input" id="username" name="username" type="text" autocomplete="username" required maxlength="64" placeholder="Enter username" />
          </div>
          <div class="form-group" id="password-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" id="password" name="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="••••••••" />
          </div>
        </div>

        <div class="twofa-panel" id="twofa-panel" style="display:none;">
          <div class="twofa-header">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span id="twofa-panel-title">Verification Required</span>
          </div>
          <p class="twofa-copy" id="twofa-panel-copy">Enter the 6-digit code from your authenticator app.</p>

          <div id="twofa-setup" style="display:none" class="twofa-setup-box">
            <div id="twofa-qr-wrap" style="display:none;justify-content:center;">
              <img id="twofa-qr" alt="QR Code" />
            </div>
            <div class="twofa-secret-wrap">
              <span class="label">Manual Key:</span>
              <code id="twofa-secret"></code>
              <code id="twofa-uri" style="display:none"></code>
            </div>
          </div>

          <input class="form-input twofa-input" id="twofa-code" name="twofa-code" type="text" inputmode="numeric" placeholder="000 000" maxlength="6" />
        </div>

        <p class="form-error" id="login-error" role="alert"></p>

        <button class="login-btn" type="submit" id="login-btn">
          <span>Continue</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>
    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
